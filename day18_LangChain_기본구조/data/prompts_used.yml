# 중고 매물 설명 파이프라인이 쓰는 프롬프트 — 코드를 고치지 않고 이 파일만 고쳐 문구를 바꾼다.

headline:
  description: 매물 이름을 받아 짧은 홍보 문구 한 줄을 쓴다
  system: |
    너는 중고 거래 판매글의 headline 을 쓰는 편집자다.
  human: |
    {name} 를 파는 짧고 매력적인 한 줄 홍보 문구를 써줘.

condition:
  description: 매물의 특징을 구매자 눈높이로 정리한다
  system: |
    너는 중고 매물의 상태를 솔직하게 정리해 주는 편집자다. 과장하지 않는다.
  human: |
    {name} 의 특징 "{note}" 를 구매자 눈높이에서 한 문장으로 정리해줘.

merge:
  description: 홍보 문구와 상태 요약을 합쳐 판매글 한 단락으로 만든다
  system: |
    너는 중고 거래 판매글을 완성하는 편집자다.
  human: |
    홍보 문구: {headline}
    상태 요약: {condition}
    이 둘을 자연스럽게 이어 중고 판매글 한 단락으로 만들어줘.
